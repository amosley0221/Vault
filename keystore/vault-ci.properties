# Credentials for keystore/vault-ci.jks — intentionally public.
#
# This key exists so that any clone of this repository, and every GitHub Actions run,
# produces an APK that installs and upgrades cleanly on a device. It is NOT a secret and
# guarantees nothing about provenance.
#
# To sign releases with your own key instead, set the repository secrets
# VAULT_KEYSTORE_BASE64 / VAULT_KEYSTORE_PASSWORD / VAULT_KEY_ALIAS / VAULT_KEY_PASSWORD
# (see .github/workflows/release.yml). Note that switching keys means users must uninstall
# the previous build before installing the new one — Android refuses upgrades across keys.
storePassword=vaultci
keyAlias=vault
keyPassword=vaultci
