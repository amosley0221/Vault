# Committed by Vault (https://github.com/amosley0221/Vault).
# Builds a small WebView wrapper around this repository's GitHub Pages site and publishes it as
# an APK release. The site itself keeps updating on its own; rerun this workflow only when the
# launcher name or icon should change. Delete this file to stop the automated builds.
name: Vault web wrapper

on:
  workflow_dispatch:
  push:
    branches: [__VAULT_BRANCH__]
    paths:
      - '.github/workflows/vault-web-wrapper.yml'

permissions:
  contents: write

concurrency:
  group: vault-web-wrapper
  cancel-in-progress: false

env:
  SITE_URL: '__VAULT_SITE_URL__'
  APP_NAME: '__VAULT_APP_NAME__'
  APP_PACKAGE: '__VAULT_PACKAGE__'
  APP_INITIAL: '__VAULT_INITIAL__'

jobs:
  wrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve a stable signing key
        run: |
          set -euo pipefail
          mkdir -p .vault
          if [ -f .vault/wrapper.jks ]; then
            echo "committed_key=false" >> "$GITHUB_ENV"
          else
            # Kept in the repository so later wrapper builds stay upgrade-compatible on device.
            keytool -genkeypair -v -keystore .vault/wrapper.jks -storetype PKCS12 \
              -alias wrapper -keyalg RSA -keysize 4096 -validity 10950 \
              -storepass vaultwrap -keypass vaultwrap \
              -dname "CN=Vault Wrapper Key, O=$GITHUB_REPOSITORY_OWNER"
            echo "committed_key=true" >> "$GITHUB_ENV"
          fi

      - name: Generate the wrapper project
        run: |
          set -euo pipefail
          PKG_PATH="$(echo "$APP_PACKAGE" | tr '.' '/')"
          mkdir -p wrapper/app/src/main/java/"$PKG_PATH" wrapper/app/src/main/res/values wrapper/app/src/main/res/mipmap-xxxhdpi

          cat > wrapper/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'wrapper'
          include ':app'
          EOF

          cat > wrapper/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n' > wrapper/gradle.properties

          cat > wrapper/app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$APP_PACKAGE'
              compileSdk 34
              defaultConfig {
                  applicationId '$APP_PACKAGE'
                  minSdk 24
                  targetSdk 34
                  versionCode ${GITHUB_RUN_NUMBER}
                  versionName '1.${GITHUB_RUN_NUMBER}'
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > wrapper/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > wrapper/app/src/main/res/values/strings.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">$APP_NAME</string></resources>
          EOF

          cat > wrapper/app/src/main/java/"$PKG_PATH"/MainActivity.java <<EOF
          package $APP_PACKAGE;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          /** Generated by Vault: a full-screen WebView onto $SITE_URL. */
          public class MainActivity extends Activity {

              private static final String SITE = "$SITE_URL";
              private WebView web;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri target = request.getUrl();
                          Uri site = Uri.parse(SITE);
                          if (target.getHost() != null && target.getHost().equals(site.getHost())) {
                              return false;
                          }
                          startActivity(new Intent(Intent.ACTION_VIEW, target));
                          return true;
                      }
                  });
                  setContentView(web);
                  if (saved != null) {
                      web.restoreState(saved);
                  } else {
                      web.loadUrl(SITE);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Resolve the launcher icon
        run: |
          set -euo pipefail
          IM="$(command -v magick || command -v convert || true)"
          if [ -z "$IM" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            IM="$(command -v magick || command -v convert)"
          fi
          ICON=""
          for MANIFEST in manifest.json site.webmanifest manifest.webmanifest; do
            if curl -fsSL "$SITE_URL/$MANIFEST" -o /tmp/manifest.json 2>/dev/null; then
              ICON="$(python3 - <<'PY'
          import json, sys
          try:
              data = json.load(open('/tmp/manifest.json'))
          except Exception:
              sys.exit(0)
          icons = data.get('icons') or []
          def area(icon):
              sizes = (icon.get('sizes') or '0x0').split(' ')[0].split('x')
              try:
                  return int(sizes[0]) * int(sizes[-1])
              except ValueError:
                  return 0
          icons.sort(key=area, reverse=True)
          if icons:
              print(icons[0].get('src', ''))
          PY
          )"
              break
            fi
          done
          if [ -n "$ICON" ] && curl -fsSL "$(python3 -c "import urllib.parse,sys;print(urllib.parse.urljoin(sys.argv[1] + '/', sys.argv[2]))" "$SITE_URL" "$ICON")" -o /tmp/icon.src 2>/dev/null; then
            "$IM" /tmp/icon.src[0] -resize 432x432 -background none -gravity center -extent 432x432 \
              wrapper/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            "$IM" -size 432x432 xc:'#0C0A09' -fill none -stroke '#C6A75E' -strokewidth 6 \
              -draw 'rectangle 40,40 392,392' -stroke none -fill '#C6A75E' \
              -pointsize 210 -gravity center -annotate 0 "$APP_INITIAL" \
              wrapper/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Build and sign
        working-directory: wrapper
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          ./gradlew --no-daemon assembleRelease
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK="$(find app/build/outputs/apk -name '*.apk' | sort | head -1)"
          mkdir -p ../dist
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" /tmp/aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks ../.vault/wrapper.jks --ks-pass pass:vaultwrap \
            --ks-key-alias wrapper --key-pass pass:vaultwrap \
            --out "../dist/${APP_PACKAGE##*.}-wrapper.apk" /tmp/aligned.apk
          rm -f ../dist/*.idsig

      - name: Keep the signing key for future builds
        if: env.committed_key == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .vault/wrapper.jks
          git commit -m "Vault: store wrapper signing key"
          git push

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="wrapper-1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk \
            --title "$APP_NAME wrapper 1.${GITHUB_RUN_NUMBER}" \
            --target "$GITHUB_SHA" \
            --notes "WebView wrapper around $SITE_URL, generated by Vault."
